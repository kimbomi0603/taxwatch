<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f2c6b 0%,#123a90 50%,#1e3a8a 100%);overflow:hidden;word-break:keep-all}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
body::before{width:440px;height:440px;top:0;right:0;transform:translate(45%,-45%)}
body::after{width:380px;height:380px;bottom:0;left:0;transform:translate(-45%,45%)}
.box{position:relative;z-index:1;width:100%;max-width:390px;background:#fff;color:#111827;border-radius:20px;padding:38px 32px 28px;text-align:center;box-shadow:0 24px 50px -12px rgba(0,0,0,.45)}
.slogan{display:inline-block;margin-bottom:14px;padding:4px 12px;border-radius:999px;background:#dbeafe;border:1px solid #bfdbfe;color:#1d4ed8;font-size:12.5px;font-weight:700}
.brand{display:flex;align-items:center;justify-content:center;gap:8px}
h1{font-size:25px;font-weight:800;letter-spacing:-.01em;background:linear-gradient(90deg,#0f2c6b,#123a90,#1e3a8a);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:8px 0 22px;font-size:14px;color:#6b7280}
input[type=password]{width:100%;padding:13px 14px;border:1.5px solid #d1d5db;border-radius:12px;background:#f9fafb;color:#111827;font:inherit;font-size:17px;text-align:center;letter-spacing:.3em}
input[type=password]:focus{outline:none;border-color:#2563eb;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.15)}
button{width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:linear-gradient(90deg,#2563eb,#1d4ed8);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 20px -10px rgba(37,99,235,.8)}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.65;cursor:wait}
label{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;font-size:13px;color:#6b7280;cursor:pointer}
#err{min-height:17px;margin-top:10px;color:#dc2626;font-size:13px;font-weight:600}
.foot{margin-top:16px;font-size:12px;color:#9ca3af}
</style>
</head>

<div class="box">

  <p>사무국 대시보드 — 비밀번호를 입력하세요</p>

const ITER=310000, REM_KEY="jjsw_dash_key", REM_EXP="jjsw_dash_exp";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function openWith(key,data){
  const iv=data.slice(16,28), ct=data.slice(28);
  const gz=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct));
  const ds=new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip")));
  const html=await ds.text();
  document.open(); document.write(html); document.close();
}
async function tryRemembered(){
  try{
    const k=localStorage.getItem(REM_KEY), e=+localStorage.getItem(REM_EXP);
    if(!k||Date.now()>e){localStorage.removeItem(REM_KEY);return}
    const key=await crypto.subtle.importKey("raw",b64(k),{name:"AES-GCM"},false,["decrypt"]);
    await openWith(key,b64(PAYLOAD));
  }catch(_){localStorage.removeItem(REM_KEY)}
}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const btn=document.getElementById("btn"),err=document.getElementById("err");
  btn.disabled=true;btn.textContent="확인 중...";err.textContent="";
  try{
    const data=b64(PAYLOAD);
    const key=await derive(document.getElementById("pw").value,data.slice(0,16));
    if(document.getElementById("rem").checked){
      const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
      localStorage.setItem(REM_KEY,btoa(String.fromCharCode(...raw)));
      localStorage.setItem(REM_EXP,String(Date.now()+30*864e5));
    }
    await openWith(key,data);
  }catch(_){
    err.textContent="비밀번호가 올바르지 않습니다";
    btn.disabled=false;btn.textContent="열기";
  }
});
tryRemembered();
