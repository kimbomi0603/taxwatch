<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>재정주권시민행동 대시보드</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d366b,#1c5cab);padding:20px}
.box{background:#fff;color:#0b0b0b;border-radius:18px;padding:38px 34px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
@media(prefers-color-scheme:dark){.box{background:#1a1a19;color:#fff}}
.slogan{font-size:11px;font-weight:700;letter-spacing:.14em;color:#2a78d6}
h1{font-size:21px;font-weight:800;margin:6px 0 4px}
p{font-size:13px;color:#898781;margin-bottom:22px}
input[type=password]{width:100%;font-size:16px;padding:12px 14px;border:1.5px solid #c3c2b7;border-radius:10px;text-align:center;letter-spacing:.3em;background:transparent;color:inherit}
input[type=password]:focus{outline:none;border-color:#2a78d6}
button{width:100%;margin-top:12px;font-size:15px;font-weight:700;padding:12px;border:none;border-radius:10px;background:#2a78d6;color:#fff;cursor:pointer;font-family:inherit}
button:hover{opacity:.92}
button:disabled{opacity:.6;cursor:wait}
label{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;font-size:12.5px;color:#898781;cursor:pointer}
#err{color:#d03b3b;font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600}
.foot{margin-top:18px;font-size:11px;color:#c3c2b7}
</style>
</head>
<body>
<div class="box">
  <div class="slogan">내 돈은 내 권리</div>
  <h1>재정주권시민행동</h1>
  <p>사무국 대시보드 — 비밀번호를 입력하세요</p>
  <form id="f">
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
    <button id="btn" type="submit">열기</button>
    <label><input type="checkbox" id="rem"> 이 기기에서 기억하기 (30일)</label>
    <div id="err"></div>
  </form>
  <div class="foot">© 재정주권시민행동 사무국</div>
</div>

const ITER=310000, REM_KEY="jjsw_dash_key", REM_EXP="jjsw_dash_exp";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function openWith(key,data){
  const iv=data.slice(16,28), ct=data.slice(28);
  const gz=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct));
  const ds=new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip")));
  const html=await ds.text();
  document.open(); document.write(html); document.close();
}
async function tryRemembered(){
  try{
    const k=localStorage.getItem(REM_KEY), e=+localStorage.getItem(REM_EXP);
    if(!k||Date.now()>e){localStorage.removeItem(REM_KEY);return}
    const key=await crypto.subtle.importKey("raw",b64(k),{name:"AES-GCM"},false,["decrypt"]);
    await openWith(key,b64(PAYLOAD));
  }catch(_){localStorage.removeItem(REM_KEY)}
}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const btn=document.getElementById("btn"),err=document.getElementById("err");
  btn.disabled=true;btn.textContent="확인 중...";err.textContent="";
  try{
    const data=b64(PAYLOAD);
    const key=await derive(document.getElementById("pw").value,data.slice(0,16));
    if(document.getElementById("rem").checked){
      const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
      localStorage.setItem(REM_KEY,btoa(String.fromCharCode(...raw)));
      localStorage.setItem(REM_EXP,String(Date.now()+30*864e5));
    }
    await openWith(key,data);
  }catch(_){
    err.textContent="비밀번호가 올바르지 않습니다";
    btn.disabled=false;btn.textContent="열기";
  }
});
tryRemembered();
</script>
